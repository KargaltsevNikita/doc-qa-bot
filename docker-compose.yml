services:

  ollama:
    image: ollama/ollama:latest

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        - CMD
        - ollama
        - list

      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

    restart: unless-stopped


  ollama-init:
    image: ollama/ollama:latest

    environment:
      OLLAMA_HOST: http://ollama:11434

    depends_on:
      ollama:
        condition: service_healthy

    command:
      - pull
      - mistral:7b-instruct

    restart: "no"


  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_OPENAI_BASE_URL: http://ollama:11434/v1
      HF_HOME: /root/.cache/huggingface

    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - hf_cache:/root/.cache/huggingface

    depends_on:
      ollama:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  ollama_data:
  hf_cache: